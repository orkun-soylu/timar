<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Timar{% endblock %}</title>
  {# Vendored, not a CDN: the documented deployment is a private network that may have no
     route to the internet at all, and an air-gapped rack should not get a broken page. #}
  <script src="/static/htmx.min.js" defer></script>
  <style>
    :root {
      --bg: #14161a; --panel: #1c1f26; --line: #2c313b;
      --text: #e6e8ec; --muted: #8b93a3;
      --up: #4ade80; --asleep: #64748b; --down: #f87171;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f7f9; --panel: #ffffff; --line: #e2e5ea;
        --text: #1a1d23; --muted: #6b7280;
        --up: #16a34a; --asleep: #94a3b8; --down: #dc2626;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--text);
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 62rem; margin: 0 auto; }
    header { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.35rem; margin: 0; letter-spacing: -0.01em; }
    .spacer { flex: 1; }
    .muted { color: var(--muted); font-size: 0.875rem; }
    .panel {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.7rem 1rem; border-bottom: 1px solid var(--line); }
    th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 0.5rem; }
    .up .dot { background: var(--up); }
    .asleep .dot { background: var(--asleep); }
    .down .dot { background: var(--down); }
    .down td:first-child { font-weight: 600; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85em; color: var(--muted); }
    form.card { max-width: 24rem; margin: 3rem auto; }
    label { display: block; margin-bottom: 1rem; }
    label span { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.3rem; }
    input {
      width: 100%; padding: 0.55rem 0.7rem; border-radius: 7px;
      border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit;
    }
    button {
      padding: 0.55rem 1.1rem; border-radius: 7px; border: 1px solid var(--line);
      background: var(--text); color: var(--bg); font: inherit; font-weight: 600; cursor: pointer;
    }
    .linkish { background: none; border: none; color: var(--muted); padding: 0; font-weight: 400; cursor: pointer; }
    .error { color: var(--down); font-size: 0.875rem; margin-bottom: 1rem; }
    .ok { color: var(--up); font-size: 0.875rem; }
    .empty { padding: 2rem 1rem; text-align: center; color: var(--muted); }

    section.panel { margin-bottom: 1.25rem; padding: 0 0 1.25rem; }
    section.panel h2 { font-size: 1rem; margin: 0; padding: 1rem; border-bottom: 1px solid var(--line); }
    section.panel h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em;
                       color: var(--muted); margin: 0 0 0.25rem; }
    .stack { padding: 1.25rem 1rem 0; }
    .stack + .stack { border-top: 1px solid var(--line); margin-top: 1rem; }
    .row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .row > label { flex: 1 1 14rem; }
    select {
      width: 100%; padding: 0.55rem 0.7rem; border-radius: 7px;
      border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit;
    }
    .hint { font-size: 0.8rem; color: var(--muted); margin: -0.4rem 0 1rem; }
    /* A hint directly under a panel heading gets no padding from .stack — it needs the
       panel's own 1rem inset, and must not be pulled up onto the heading's bottom border. */
    section.panel > .hint { margin: 0.9rem 1rem 0; }
    label.inline { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.8rem; }
    label.inline input { width: auto; }
    label.inline span { margin: 0; color: var(--text); font-size: 0.9rem; }
    .actions { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    button.secondary { background: none; color: var(--text); font-weight: 400; }
    .result { font-size: 0.875rem; }
    .result.htmx-request::after { content: "…"; color: var(--muted); }
    .notice { padding: 0.8rem 1rem; margin-bottom: 1.25rem; font-size: 0.875rem; }
    .notice.good { border-left: 3px solid var(--up); }
    .notice.bad { border-left: 3px solid var(--down); color: var(--down); }
    section.panel table { margin-bottom: 0; }
    a { color: inherit; }
  </style>
</head>
<body>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
