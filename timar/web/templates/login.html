{% extends "base.html" %}
{% block title %}{{ _("Sign in") }} — Timar{% endblock %}
{% block body %}
<header><span class="spacer"></span>{% include "_lang.html" %}</header>
<form class="card panel" method="post" action="/login" style="padding:1.5rem">
  <h1 style="margin-bottom:1rem">{{ _("Sign in") }}</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <label><span>{{ _("Username") }}</span><input name="username" autocomplete="username" required autofocus></label>
  <label><span>{{ _("Password") }}</span><input name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit">{{ _("Sign in") }}</button>
</form>
{% endblock %}
