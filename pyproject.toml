[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timar"
version = "0.1.0"
description = "Agentless fleet care for homelabs: wake, update, and read the logs of machines that are usually off"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Orkun Soylu" }]
keywords = ["homelab", "ssh", "wake-on-lan", "openwrt", "proxmox", "self-hosted"]

dependencies = [
    "paramiko>=3.0",
    "PyYAML>=6.0",
    # One HTTP client for all three LLM providers — see the note at the top of timar/llm.py
    # for why no vendor SDKs.
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",  # FastAPI needs this to read HTML form posts
    "bcrypt>=4.1",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
timar = "timar.web.__main__:main"

[project.urls]
Homepage = "https://timar.tools"
Source = "https://github.com/orkun-soylu/timar"

[tool.setuptools.packages.find]
where = ["."]
include = ["timar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
