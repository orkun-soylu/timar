[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timar"
version = "0.1.0"
description = "Agentless fleet care for homelabs: wake, update, and read the logs of machines that are usually off"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Orkun Soylu" }]
keywords = ["homelab", "ssh", "wake-on-lan", "openwrt", "proxmox", "self-hosted"]

dependencies = [
    "paramiko>=3.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://timar.tools"
Source = "https://github.com/orkun-soylu/timar"

[tool.setuptools.packages.find]
where = ["."]
include = ["timar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
