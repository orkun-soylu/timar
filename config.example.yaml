# Timar configuration. Lives at /data/config.yaml inside the container.
#
# Until settings can be edited from the UI, copy this in and edit it:
#   docker cp config.example.yaml timar:/data/config.yaml
# There is no restart needed for the server list -- it is read on each request.

servers:
  # An always-on machine. The minimum a server needs is a name, an address and a platform.
  - name: web-01
    host: 192.0.2.10          # IP or hostname; a non-standard SSH port goes after it: 192.0.2.10:2222
    user: deploy
    platform: linux           # linux | openwrt | proxmox

    # Optional: replaces the platform's default update command (the README lists them). The
    # Linux default is apt-get upgrade --with-new-pkgs with --force-confold, then autoremove and
    # clean. On OpenWrt there IS no default -- see the note further down.
    # update_cmd: "sudo apt-get update -qq && sudo apt-get -y upgrade --with-new-pkgs && ./my-extra-step.sh"

    # Optional: how long that command may take, in seconds (default 1800, range 60-14400).
    # Raise it for a host that pulls container images or rebuilds a DKMS module. Reaching the
    # limit does NOT stop the remote command -- it keeps running while the run is recorded as a
    # failure, and the host is left powered on rather than shut down mid-upgrade.
    # update_timeout: 3600

    # Optional: the machine's own web interface -- a hypervisor, a router. While the machine is
    # up, its name on the dashboard links here. Without a scheme it is opened as https://.
    # web_url: "https://192.0.2.10:8006"

    # Optional: a line of context handed to the log analysis, to explain behaviour that looks
    # alarming but is not. This is the cheapest way to stop a recurring false alarm.
    # context: "Runs a nightly batch job that logs connection resets; those are expected."

    # Optional: scheduled jobs to watch. Timar checks that each one *ran today* and *finished*.
    # Watching for absence is the point -- a job that stops being scheduled writes no error at
    # all, so nothing but a missing run reveals it.
    # job_logs:
    #   - path: /var/log/backup.log
    #     started_marker: "Backup started"
    #     completed_marker: "Backup completed"

    # Optional: extra log files to scan for error keywords.
    # watch_logs:
    #   - /var/log/myapp.log

    # Optional: use a specific key instead of the one Timar generated for itself.
    # ssh_key: ~/.ssh/id_ed25519

  # An on-demand machine. `wol_mac` is what marks it as expected-to-be-asleep: the dashboard
  # shows it as "asleep" rather than "down", and the log analysis is told its being off is
  # normal. Updates wake it, update it, and shut it back down.
  - name: gpu-01
    host: 192.0.2.20
    user: deploy
    platform: linux
    wol_mac: "aa:bb:cc:dd:ee:ff"

    # Advanced, config.yaml only -- the server form does not show these as fields (it notes
    # when they are set), and saving the form keeps them. See "Advanced wake settings" in the
    # README.
    #
    # The address the magic packet is sent to. Default 255.255.255.255, which leaves through the
    # default route's interface; on a host with several networks give the target segment's own
    # broadcast address so the packet leaves through the right one.
    # wol_broadcast: 192.0.2.255
    #
    # Send the packet from another configured server instead of from Timar. A broadcast only
    # reaches its own segment, so a relay is required when the target is in a different subnet
    # (another site, an office network) -- no networking mode can reach those -- and when Timar
    # itself runs on a bridge network. The relay must be always on, already enrolled, and have
    # python3 or wakeonlan.
    # wol_relay: web-01

  # A machine that is off on purpose but has no way to be woken -- a Wi-Fi board, a laptop,
  # anything switched on by hand. `on_demand: true` makes off read as "asleep" rather than
  # "down", and an update run skips it while it is off instead of failing on the missing MAC.
  # Timar offers it no power buttons: it could not bring it back. Ignored next to a `wol_mac`.
  - name: printer
    host: 192.0.2.50
    user: pi
    platform: linux
    on_demand: true

  # A router. OpenWrt has NO default update command, deliberately: an unattended `apk upgrade`
  # can exhaust the overlay partition or land a kernel-module mismatch, and the machine that
  # breaks is the one carrying the SSH session you would repair it from. Set `update_cmd`
  # yourself if you want it; leaving it unset means this host is swept for logs but not updated.
  - name: router
    host: 192.0.2.1
    user: root
    platform: openwrt

  # A hypervisor and the guest it is responsible for. Timar wakes the host, starts the guest,
  # updates it, and puts both back the way it found them -- so the guest needs no `wol_mac` of
  # its own, and it inherits on-demand from its host: being off is normal for it exactly when
  # being off is normal for the machine underneath it. A guest of an *always-on* hypervisor is
  # therefore still always-on, so a 24/7 VM that has crashed is reported rather than excused.
  - name: hv-01
    host: 192.0.2.30
    user: root
    platform: proxmox
    wol_mac: "aa:bb:cc:dd:ee:01"
    manages_vms:
      - vm_id: 100
        server_name: vm-01
  - name: vm-01
    host: 192.0.2.31
    user: deploy
    platform: linux

# Docker Compose projects on those servers -- the containers page. One entry per project
# directory; Timar reads the state over SSH (`docker ps`, grouped by the compose working-directory
# label) and starts, stops and restarts it with `docker compose` there. The account needs to be in
# the `docker` group or have passwordless sudo.
containers:
  - name: immich
    server: web-01                      # a configured server whose platform runs Docker
    path: /srv/immich                   # absolute: the directory with docker-compose.yml
    web_url: "https://photos.example.lan"          # optional: the name links here while it runs
    health_url: "http://192.0.2.10:2283/api/server/ping"   # optional: must answer below HTTP 500
    # update: pull | custom | skip     -- pull (default): compose pull, then up -d if running
    # update_cmd: "docker compose up -d --build"   # with update: custom, run in the directory
    # update_timeout: 1800
  - name: batch-tools
    server: web-01
    path: /srv/batch-tools
    on_demand: true                     # stopped on purpose: reads as asleep, not down; an
                                        # update pulls it and leaves it stopped

# Optional: servers left out of a job, by name -- set from the pencil on a job's row (reports
# page). A job runs on every server that is enrolled (Timar has logged in to it with its key) and
# not listed here; the others are not woken, not connected to, and named as skipped.
# job_exclude:
#   update: [pen-kali-01]
#   log_sweep: []

log_check:
  journal_hours: 6      # how far back to read the system log
  disk_threshold: 85    # percent full before a filesystem is reported

# Optional. Without it, waking, updating and the log sweep all still work -- you just get the
# raw findings instead of a written assessment.
#
# provider: anthropic | openai | ollama
#   anthropic  needs api_key.        Default model: claude-opus-5
#   openai     any OpenAI-compatible endpoint -- OpenAI, OpenRouter, LM Studio, vLLM,
#              llama.cpp. Local servers usually need no api_key at all; leave it out.
#   ollama     Ollama's native API.  base_url defaults to http://localhost:11434
# llm:
#   provider: ollama
#   base_url: http://192.0.2.40:11434
#   model: <the model you have pulled>
